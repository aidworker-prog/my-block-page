<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Напоминание</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #212529;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .motivation-image {
            width: 150px;
            height: auto;
            margin-bottom: 30px;
            opacity: 0.85;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0 0 15px 0;
            color: #495057;
        }
        p {
            font-size: 22px;
            font-weight: bold;
            margin: 0;
            color: #dc3545; /* Красный цвет для важного предупреждения */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Картинка фокуса/цели из интернета -->
        <img class="motivation-image" src="https://unsplash.com" alt="Фокус">
        
        <h1>Напоминание самому себе:</h1>
        <p>Ты потеряешь время</p>
    </div>

</body>
</html>
